<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>八百米 — 三张 A3 图</title>
<style>
  :root { --ink:#1c1a17; --paper:#f4f1ea; --line:#c9c2b4; --muted:#6b6459; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--paper); color:var(--ink);
         font-family: "Songti SC","Noto Serif SC","Source Han Serif SC",Georgia,serif; }
  header { max-width:1100px; margin:0 auto; padding:64px 24px 24px; }
  h1 { font-size:42px; margin:0 0 8px; letter-spacing:.08em; }
  .sub { color:var(--muted); font-size:15px; line-height:1.7; max-width:640px; }
  main { max-width:1100px; margin:0 auto; padding:16px 24px 80px; }
  figure { margin:0 0 56px; }
  figure img { width:100%; height:auto; display:block; border:1px solid var(--line); background:#fff; }
  figcaption { margin-top:12px; font-size:14px; color:var(--muted); display:flex; gap:16px; flex-wrap:wrap; }
  a { color:var(--ink); text-underline-offset:3px; }
  .pdf { display:inline-block; margin-top:8px; border:1px solid var(--ink); padding:10px 18px;
         text-decoration:none; font-size:14px; }
  footer { max-width:1100px; margin:0 auto; padding:0 24px 64px; color:var(--muted); font-size:13px; }
</style>
</head>
<body>
<header>
  <h1>八百米</h1>
  <p class="sub">第二届乡村新消费暨 OPC 创新实践大赛 · 天心区滨洲新村定向命题。
  三张 A3：一张米字格、三种走法、一份地志。下面是可直接看的成图与设计说明。</p>
</header>
<main>
  <figure>
    <img src="submission/01-%E7%B1%B3%E5%AD%97%E6%A0%BC.jpg" alt="01 米字格">
    <figcaption><span>01 · 米字格</span></figcaption>
  </figure>
  <figure>
    <img src="submission/02-%E4%B8%89%E7%A7%8D%E8%B5%B0%E6%B3%95.jpg" alt="02 三种走法">
    <figcaption><span>02 · 三种走法</span></figcaption>
  </figure>
  <figure>
    <img src="submission/03-%E5%9C%B0%E5%BF%97.jpg" alt="03 地志">
    <figcaption><span>03 · 地志</span></figcaption>
  </figure>
  <figure>
    <img src="submission/poster-%E6%B5%B7%E6%8A%A5.jpg" alt="海报">
    <figcaption><span>海报</span></figcaption>
  </figure>
  <a class="pdf" href="submission/%E8%AE%BE%E8%AE%A1%E8%AF%B4%E6%98%8E.pdf">设计说明（PDF）</a>
</main>
<footer>仓库：<a href="https://github.com/hkmpn9s6dh-commits/hackathon-2026-ba-mi-bai">hackathon-2026-ba-mi-bai</a></footer>
</body>
</html>
